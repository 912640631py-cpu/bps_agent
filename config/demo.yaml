    model: deepseek-v4-flash-0731
    token_env: COMPANY_DEEPSEEK_API_KEY
    timeout_seconds: 300
    attempts: 3
  official:
    base_url: https://api.deepseek.com
    model: deepseek-v4-flash
    token_env: DEEPSEEK_API_KEY
    timeout_seconds: 300
