bps:
  endpoint: https://10.66.250.104
  template: ai_bps_puyu
  slot: 4
  ports: [4, 5]
  group: 10
  total_bandwidth_mbps: 400
  allow_malware: false
  verify_tls: false
  poll_interval_seconds: 5
  run_timeout_seconds: 7200
  registration_grace_seconds: 30
  port_release_attempts: 6
  port_release_retry_backoff_seconds: 5
  report_poll_interval_seconds: 10
  report_attempts: 30
  report_type: CSV
  report_data_type: ALL
  max_report_bytes: 52428800
  pdf_report_timeout_seconds: 1200
  max_pdf_report_bytes: 536870912

dut:
  collection_method: backend_ssh
  interfaces: [T1/1, T1/2]
  backend:
    host: 10.66.246.133
    port: 50023
    interval_seconds: 10
    connect_timeout_seconds: 10
    command_timeout_seconds: 30
    read_attempts: 3
    read_retry_backoff_seconds: 0.5
  frontend:
    endpoint: https://10.66.246.133
    verify_tls: false
    cooldown_seconds: 10
    keepalive_interval_seconds: 60
    baseline_seconds: 600
    read_attempts: 3
    read_retry_backoff_seconds: 0.5

assessment:
  goal: 验证 DUT 在指定并发和带宽下的资源与转发表现
  expectations:
    - 结合 BPS 自带 Test Criteria 判断测试目标是否达成
    - 结合 DUT 打流期间连续采样 CSV 判断资源与转发表现
    - 只依据给定证据判断，不臆造缺失指标

bps_only_assessment:
  goal: 仅依据 BPS 证据验证指定流量目标与性能稳定性
  expectations:
    - 结合 BPS 自带 Test Criteria 判断测试目标是否达成
    - 结合吞吐、Concurrent Flows 和 Flow Rate 时序分析判断性能是否稳定
    - BPS-only 模式不提供 DUT 观测，不得臆造或要求 DUT 指标

llm:
  provider: official
  reasoning_effort: max
  company:
    base_url: https://aigw.inone.nsfocus.com/deepseek/v1
    model: deepseek-v4-flash-0731
    token_env: COMPANY_DEEPSEEK_API_KEY
    timeout_seconds: 300
    attempts: 3
  official:
    base_url: https://api.deepseek.com
    model: deepseek-v4-flash
    token_env: DEEPSEEK_API_KEY
    timeout_seconds: 300
    attempts: 3

storage:
  artifact_dir: artifacts
  checkpoint_db: .state/checkpoints.sqlite3

evaluation:
  mode: bps_and_dut
  max_attempts: 6
